
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wochenkoch">
  <meta name="description" content="Dein persönlicher Wochenplan und Einkaufsliste">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">

  <title>Wochenkoch</title>
</head>

<body>
  <div class="shell">

    <header class="top">
      <div class="brand">
        <button
          id="menuToggle"
          type="button"
          aria-label="Menü öffnen"
          aria-expanded="false"
          aria-controls="sideMenu"
          style="background:none;border:0;font-size:25px;cursor:pointer;padding:6px 12px 6px 0;color:inherit"
        >☰</button>

        <span class="brandmark">◒</span>
        <span>wochenkoch<span class="branddot">.</span></span>
      </div>

      <span class="topright" id="regionTop">Deine Einkaufsregion</span>
    </header>

    <div
      id="menuBackdrop"
      hidden
      style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:98"
    ></div>

    <aside
      id="sideMenu"
      aria-label="Seitenmenü"
      hidden
      style="position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);background:#fff;z-index:99;padding:25px 20px;box-shadow:4px 0 25px rgba(0,0,0,.15)"
    >
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px">
        <strong>wochenkoch.</strong>
        <button id="menuClose" type="button" aria-label="Menü schließen" style="background:none;border:0;font-size:26px;cursor:pointer">×</button>
      </div>

      <button
        type="button"
        data-menu-tab="profile"
        style="display:block;width:100%;padding:15px;text-align:left;border:0;border-radius:12px;background:#f4f6f2;font-size:16px;cursor:pointer"
      >♙ Mein Profil</button>
    </aside>

    <main id="content" tabindex="-1"></main>

    <nav class="tabs" aria-label="Hauptnavigation">
      <button data-tab="home" class="active">
        <span class="tabicon">⌂</span>
        <span>Start</span>
      </button>

      <button data-tab="plan">
        <span class="tabicon">▦</span>
        <span>Wochenplan</span>
      </button>

      <button data-tab="shop">
        <span class="tabicon">☷</span>
        <span>Einkaufen</span>
      </button>

      <button data-tab="prices">
        <span class="tabicon">€</span>
        <span>Preise</span>
      </button>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script type="module" src="./cloud.js"></script>
  <script src="./averages.js"></script>
  <script src="./recipes-extra.js"></script>
  <script src="./app.js" defer></script>
  <script src="./rezeptwelt.js" defer></script>
</body>
</html>
